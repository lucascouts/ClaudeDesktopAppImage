name: Build and release

on:
  # No schedule: claude.ai/api is behind Cloudflare and 403s GitHub-hosted
  # runner IPs, so the latest version/URL cannot be auto-probed from CI.
  # Trigger manually with the .deb URL (obtained where the API is reachable),
  # or from a self-hosted/residential runner. See README.
  workflow_dispatch:
    inputs:
      deb_url:
        description: "Full https://downloads.claude.ai/.../Claude-<id>.deb URL (x64). Required."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    # Never let a fork publish releases under its own name.
    if: github.repository_owner == 'lucascouts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve version from the .deb URL
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          set -euo pipefail
          case "$DEB_URL" in
            https://downloads.claude.ai/releases/linux/x64/*/Claude-*.deb) ;;
            *) echo "deb_url must be an x64 downloads.claude.ai release URL" >&2; exit 1 ;;
          esac
          version="$(printf '%s' "$DEB_URL" | sed -n 's#.*/linux/x64/\([0-9][0-9.]*\)/Claude-.*#\1#p')"
          [[ "$version" =~ ^[0-9][0-9.]*$ ]] || { echo "bad version parsed: $version" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >>"$GITHUB_OUTPUT"
            echo "v$version already released, nothing to do"
          else
            echo "new=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install zsync (for AppImageUpdate metadata)
        if: steps.probe.outputs.new == 'true'
        run: sudo apt-get update && sudo apt-get install -y zsync

      - name: Build AppImages (x86_64 + aarch64)
        if: steps.probe.outputs.new == 'true'
        env:
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          set -euo pipefail
          # arm64 lives at the same path with the same build id (only /x64/ -> /arm64/).
          deb_arm64="$(printf '%s' "$DEB_URL" | sed 's#/linux/x64/#/linux/arm64/#')"
          ./build.sh x64 "$DEB_URL"
          ./build.sh arm64 "$deb_arm64"

      - name: Create release
        if: steps.probe.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.probe.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --title "Claude Desktop $VERSION (unofficial AppImage)" \
            --notes "Unofficial AppImage repackaged from Anthropic's official .deb release (downloads.claude.ai). Not affiliated with or endorsed by Anthropic. The bundled application binaries are unmodified and remain subject to Anthropic's Consumer Terms; releases will be removed on request from Anthropic." \
            Claude_Desktop_Unofficial-*.AppImage Claude_Desktop_Unofficial-*.AppImage.zsync
